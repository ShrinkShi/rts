name: Validate dev6 parser hotfix

on:
  push:
    branches:
      - feature/v0.16.0-dev6-height-2_5d-foundation
    paths:
      - .github/workflows/dev6-parser-hotfix.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.16.0-dev6-height-2_5d-foundation
          fetch-depth: 0

      - name: Run static validator
        shell: bash
        run: |
          python tools/validate_project.py | tee /tmp/dev6-validation.txt

      - name: Record validation result
        shell: bash
        run: |
          {
            echo "v0.16.0-dev.6 static validation"
            echo "branch: feature/v0.16.0-dev6-height-2_5d-foundation"
            echo "result: passed"
            echo
            cat /tmp/dev6-validation.txt
          } > docs/V0_16_0_DEV6_STATIC_VALIDATION.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/V0_16_0_DEV6_STATIC_VALIDATION.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "test: record dev6 static validation"
          git push origin HEAD:feature/v0.16.0-dev6-height-2_5d-foundation
