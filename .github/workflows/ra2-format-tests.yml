name: Validate RA2 map formats

on:
  pull_request:
    paths:
      - "tools/ra2_*.py"
      - "tools/build_ra2_runtime_bundle.py"
      - "tools/validate_ra2_runtime_bundle.py"
      - "tools/test_ra2_map_importer.py"
      - "tools/test_ra2_theater_tmp.py"
      - "tests/python/test_ra2_*.py"
      - "tests/python/test_validate_ra2_runtime_bundle.py"
      - ".github/workflows/ra2-format-tests.yml"
  push:
    branches: [main]
    paths:
      - "tools/ra2_*.py"
      - "tools/build_ra2_runtime_bundle.py"
      - "tools/validate_ra2_runtime_bundle.py"
      - "tools/test_ra2_map_importer.py"
      - "tools/test_ra2_theater_tmp.py"
      - "tests/python/test_ra2_*.py"
      - "tests/python/test_validate_ra2_runtime_bundle.py"
      - ".github/workflows/ra2-format-tests.yml"

jobs:
  ra2-format-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run map and TMP reader tests
        working-directory: tools
        run: python -m unittest -v test_ra2_map_importer.py test_ra2_theater_tmp.py
      - name: Run runtime bundle tests
        env:
          PYTHONPATH: tools
        run: python -m unittest discover -s tests/python -v
