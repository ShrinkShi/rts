name: Validate RA2 map formats

on:
  pull_request:
    paths:
      - "tools/ra2_*.py"
      - "tools/test_ra2_*.py"
      - ".github/workflows/ra2-format-tests.yml"
  push:
    branches: [main]
    paths:
      - "tools/ra2_*.py"
      - "tools/test_ra2_*.py"
      - ".github/workflows/ra2-format-tests.yml"

jobs:
  ra2-format-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run RA2 format unit tests
        working-directory: tools
        run: python -m unittest discover -v -p "test_ra2_*.py"
