name: Assemble RA2 dev10 payload

on:
  push:
    branches:
      - feature/v0.16.0-dev10-ra2-runtime-map
    paths:
      - ".dev10_bundle/READY"

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/v0.16.0-dev10-ra2-runtime-map
          fetch-depth: 0

      - name: Reconstruct and extract verified payload
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations
          import base64
          import hashlib
          import shutil
          import tarfile
          from pathlib import Path

          repo = Path.cwd().resolve()
          staging = repo / ".dev10_bundle"
          parts = sorted(staging.glob("part_*"))
          if len(parts) != 34:
              raise SystemExit(f"Expected 34 payload parts, found {len(parts)}")
          encoded = "".join(path.read_text(encoding="ascii") for path in parts)
          payload = base64.b64decode(encoded, validate=True)
          expected = "bb665637b4f0cefbde9d90561136a7849dfc1f945380fe599ad882f7c46aa810"
          actual = hashlib.sha256(payload).hexdigest()
          if actual != expected:
              raise SystemExit(f"Payload SHA-256 mismatch: expected {expected}, got {actual}")

          archive_path = staging / "payload.tar.xz"
          archive_path.write_bytes(payload)
          with tarfile.open(archive_path, "r:xz") as archive:
              for member in archive.getmembers():
                  target = (repo / member.name).resolve()
                  if repo != target and repo not in target.parents:
                      raise SystemExit(f"Unsafe archive path: {member.name}")
              archive.extractall(repo)

          shutil.rmtree(staging)
          workflow = repo / ".github/workflows/assemble-ra2-dev10.yml"
          workflow.unlink()
          PY

      - name: Run RA2 format and runtime tests
        env:
          PYTHONPATH: tools
        run: |
          python -m unittest -v tools/test_ra2_map_importer.py tools/test_ra2_theater_tmp.py
          python -m unittest discover -s tests/python -v
          python tools/validate_ra2_runtime_bundle.py --project-root .
          python -m py_compile tools/*.py tests/python/*.py

      - name: Commit assembled runtime bundle
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "assets(dev10): add real RA2 runtime bundle"
          git push origin HEAD:feature/v0.16.0-dev10-ra2-runtime-map
